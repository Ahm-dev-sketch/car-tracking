
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0208" />
      <stop offset="50%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Solid / Rounded Squircle (Deep Komodo Red / Crimson) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Precision Telemetry Ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#e11d48" stroke-width="6" opacity="0.3" stroke-dasharray="14 10" />
  
  <!-- Subtle Cardinal Ticks -->
  <line x1="256" y1="44" x2="256" y2="72" stroke="#fb7185" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="440" x2="256" y2="468" stroke="#fb7185" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <line x1="44" y1="256" x2="72" y2="256" stroke="#fb7185" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  <line x1="440" y1="256" x2="468" y2="256" stroke="#fb7185" stroke-width="6" stroke-linecap="round" />

  <!-- Inner High-Contrast Hex / Shield Base -->
  <circle cx="256" cy="256" r="148" fill="#180206" stroke="#fb7185" stroke-width="5" opacity="0.85" />

  <!-- Dynamic Geometric "KF" + Nav Arrow Monogram -->
  <g transform="translate(256, 256)">
    <!-- Central Dynamic Nav Compass Arrow (Pointing Forward/North-East) -->
    <!-- Left Wing (Crimson Scarlet) -->
    <polygon points="0,-104 -78,64 0,28" fill="url(#accentGrad)" />
    <!-- Right Wing (Warm Silver/Pink Accent) -->
    <polygon points="0,-104 78,64 0,28" fill="#fecdd3" />
    
    <!-- Central Core Radar Ping Dot (Whoosh Golden Spark) -->
    <circle cx="0" cy="28" r="14" fill="url(#goldGrad)" />
    
    <!-- Pulse Ring around Beacon -->
    <circle cx="0" cy="28" r="32" fill="none" stroke="#fef08a" stroke-width="4" opacity="0.75" stroke-dasharray="6 4" />
  </g>

  <!-- Bottom Brand Text Monogram Badge -->
  <rect x="180" y="380" width="152" height="36" rx="18" fill="#4c0519" stroke="#fb7185" stroke-width="3" />
  <text x="256" y="404" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="900" fill="#ffffff" letter-spacing="3.5">
    KCIC
  </text>
</svg>
